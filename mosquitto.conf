# ==============================================================================
# Eclipse Mosquitto Configuration: flood-ews
# ==============================================================================

# Standard Unencrypted Listener (Dev & Simulation)
listener 1883
allow_anonymous true

# ==============================================================================
# PRODUCTION HARDENING (Uncomment for Production Deployments)
# ==============================================================================
# 1. Disable Anonymous Access
# allow_anonymous false
# password_file /mosquitto/config/password.txt

# 2. Encrypted TLS Listener (Port 8883)
# listener 8883
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# require_certificate false
# tls_version tlsv1.2

# 3. Connection Limits & Persistence
persistence true
persistence_location /mosquitto/data/
log_dest stdout
