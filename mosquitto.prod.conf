# ============================================================================
# Eclipse Mosquitto Production Configuration (Hardened)
# ============================================================================

# Disable unauthenticated anonymous access
allow_anonymous false

# Password file generated with: mosquitto_passwd -c /mosquitto/config/passwords <username>
password_file /mosquitto/config/passwords

# Plaintext listener (Internal Docker network only)
listener 1883

# TLS/SSL Encrypted listener (Public/External traffic)
listener 8883
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# cafile /mosquitto/config/certs/ca.crt

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
